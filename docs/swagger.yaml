basePath: /api/v1
definitions:
  apperror.AppError:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  dto.CheckoutRequest:
    properties:
      amount:
        type: integer
    required:
    - amount
    type: object
  dto.CheckoutResponse:
    properties:
      redirect_url:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 150
        type: string
      password:
        maxLength: 255
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
    type: object
  dto.MetaPagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.MidtransWebhookPayload:
    properties:
      fraud_status:
        type: string
      gross_amount:
        type: string
      order_id:
        type: string
      signature_key:
        type: string
      status_code:
        type: string
      transaction_status:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        maxLength: 150
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        maxLength: 255
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.RegisterResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.TopUpRequest:
    properties:
      amount:
        type: integer
    required:
    - amount
    type: object
  dto.TopUpResponse:
    properties:
      amount:
        type: integer
      balance_after:
        type: integer
      balance_before:
        type: integer
      created_at:
        type: string
      status:
        type: string
      transaction_id:
        type: integer
      type:
        type: string
      wallet_id:
        type: integer
    type: object
  dto.TransactionListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.TransactionResponse'
        type: array
      meta:
        $ref: '#/definitions/dto.MetaPagination'
    type: object
  dto.TransactionResponse:
    properties:
      amount:
        type: integer
      balance_after:
        type: integer
      balance_before:
        type: integer
      created_at:
        type: string
      status:
        type: string
      transaction_id:
        type: integer
      type:
        type: string
    type: object
  dto.TransferRequest:
    properties:
      amount:
        type: integer
      note:
        maxLength: 255
        type: string
      to_user_id:
        type: integer
    required:
    - amount
    - to_user_id
    type: object
  dto.TransferResponse:
    properties:
      amount:
        type: integer
      balance_after:
        type: integer
      balance_before:
        type: integer
      counterparty_user_id:
        type: integer
      created_at:
        type: string
      status:
        type: string
      transaction_id:
        type: integer
      transfer_id:
        type: integer
      type:
        type: string
    type: object
  dto.WalletResponse:
    properties:
      balance:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  dto.WithdrawalRequest:
    properties:
      account_holder_name:
        type: string
      account_number:
        type: string
      amount:
        type: integer
      channel_code:
        type: string
    required:
    - account_holder_name
    - account_number
    - amount
    - channel_code
    type: object
  dto.WithdrawalResponse:
    properties:
      account_holder_name:
        type: string
      account_number:
        type: string
      amount:
        type: integer
      balance_after:
        type: integer
      balance_before:
        type: integer
      channel_code:
        description: ganti nama, alasan di bawah
        type: string
      created_at:
        type: string
      reference_id:
        type: string
      status:
        type: string
      transaction_id:
        type: integer
      wallet_id:
        type: integer
    type: object
  dto.XenditPayoutWebhookPayload:
    properties:
      data:
        properties:
          reference_id:
            type: string
          status:
            type: string
        type: object
      event:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error: {}
      success:
        example: false
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      success:
        example: true
        type: boolean
    type: object
info:
  contact: {}
  description: Digital wallet built with Go, Gin, GORM, and Redis.
  title: Digital Wallet API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password, returns a JWT access
        token and creates a session in Redis.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: INVALID_CREDENTIALS
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the current session by deleting it from Redis.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: UNAUTHORIZED / INVALID_TOKEN / TOKEN_HAS_EXPIRED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with a bcrypt-hashed password. Email
        must be unique.
      parameters:
      - description: User payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RegisterResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "409":
          description: EMAIL_ALREADY_EXISTS
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      summary: Register a new user
      tags:
      - auth
  /transactions:
    get:
      description: Returns a paginated, filterable list of the authenticated user's
        wallet transactions.
      parameters:
      - description: Filter by type
        enum:
        - TOPUP
        - TRANSFER_IN
        - TRANSFER_OUT
        - WITHDRAWAL
        in: query
        name: type
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD), defaults to today if start_date is set
        in: query
        name: end_date
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.TransactionListResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED / INVALID_TOKEN / TOKEN_HAS_EXPIRED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: List transaction history
      tags:
      - transaction
  /transactions/{id}:
    get:
      description: Returns a single transaction. Returns 404 both when the transaction
        does not exist and when it belongs to another user, to avoid leaking existence.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.TransactionResponse'
              type: object
        "400":
          description: BAD_REQUEST
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED / INVALID_TOKEN / TOKEN_HAS_EXPIRED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "404":
          description: TRANSACTION_NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Get transaction detail
      tags:
      - transaction
  /wallets/me:
    get:
      description: Returns the balance and metadata of the authenticated user's wallet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.WalletResponse'
              type: object
        "401":
          description: UNAUTHORIZED / INVALID_TOKEN / TOKEN_HAS_EXPIRED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Get my wallet
      tags:
      - wallet
  /wallets/topup:
    post:
      consumes:
      - application/json
      description: Adds balance to the authenticated user's wallet. Requires a client-generated
        Idempotency-Key to safely retry on network failure.
      parameters:
      - description: Client-generated UUID v4, unique per logical operation
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Top up payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TopUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.TopUpResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_ERROR / MISSING_IDEMPOTENCY_KEY /
            INVALID_AMOUNT
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED / INVALID_TOKEN / TOKEN_HAS_EXPIRED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "404":
          description: WALLET_NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "409":
          description: IDEMPOTENCY_KEY_CONFLICT / REQUEST_IN_PROGRESS
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "422":
          description: PREVIOUS_ATTEMPT_FAILED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Top up wallet balance
      tags:
      - wallet
  /wallets/topup/checkout:
    post:
      consumes:
      - application/json
      description: Creates a Midtrans Snap payment session for the authenticated user.
        Returns a redirect URL to complete payment; the wallet is credited asynchronously
        once Midtrans confirms via webhook, not immediately in this response.
      parameters:
      - description: Client-generated UUID v4, unique per checkout attempt
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Checkout payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CheckoutResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_ERROR / MISSING_IDEMPOTENCY_KEY /
            INVALID_AMOUNT
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED / INVALID_TOKEN / TOKEN_HAS_EXPIRED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "409":
          description: IDEMPOTENCY_KEY_CONFLICT / REQUEST_IN_PROGRESS
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "422":
          description: PREVIOUS_ATTEMPT_FAILED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Create a top-up checkout session
      tags:
      - payment
  /wallets/transfer:
    post:
      consumes:
      - application/json
      description: Moves balance to another user's wallet using ordered row locking
        to prevent deadlock, with idempotency key support for safe retry.
      parameters:
      - description: Client-generated UUID v4, unique per logical operation
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Transfer payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TransferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.TransferResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_ERROR / MISSING_IDEMPOTENCY_KEY /
            INVALID_AMOUNT
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED / INVALID_TOKEN / TOKEN_HAS_EXPIRED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "404":
          description: WALLET_NOT_FOUND / RECIPIENT_NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "409":
          description: IDEMPOTENCY_KEY_CONFLICT / REQUEST_IN_PROGRESS
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "422":
          description: INSUFFICIENT_BALANCE / SELF_TRANSFER_NOT_ALLOWED / PREVIOUS_ATTEMPT_FAILED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Transfer balance to another user
      tags:
      - wallet
  /wallets/withdraw:
    post:
      consumes:
      - application/json
      description: Creates a withdrawal request for the authenticated user. The withdrawal
        will be processed asynchronously.
      parameters:
      - description: Client-generated UUID v4, unique per withdrawal attempt
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Withdrawal payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.WithdrawalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.WithdrawalResponse'
              type: object
        "400":
          description: BAD_REQUEST / VALIDATION_ERROR / MISSING_IDEMPOTENCY_KEY /
            INVALID_AMOUNT
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: UNAUTHORIZED / INVALID_TOKEN / TOKEN_HAS_EXPIRED
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "404":
          description: WALLET_NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "409":
          description: IDEMPOTENCY_KEY_CONFLICT / REQUEST_IN_PROGRESS
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "422":
          description: PREVIOUS_ATTEMPT_FAILED / INSUFFICIENT_BALANCE
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
      security:
      - BearerAuth: []
      summary: Create a withdrawal request
      tags:
      - withdrawal
  /webhooks/midtrans:
    post:
      consumes:
      - application/json
      description: Receives asynchronous payment status updates from Midtrans. NOT
        intended to be called manually — Midtrans invokes this using a payload signed
        with the Server Key. "Try it out" in this UI will always fail signature verification
        since it requires a real Midtrans-signed request; documented here for completeness
        only.
      parameters:
      - description: Midtrans notification payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MidtransWebhookPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: WEBHOOK_PAYLOAD_TOO_LARGE
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "401":
          description: INVALID_WEBHOOK_SIGNATURE
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
                error:
                  $ref: '#/definitions/apperror.AppError'
              type: object
        "404":
          description: RECORD_NOT_FOUND (unknown provider_ref_id)
          schema:
            allOf:
            - $ref: '#/definitions/response.ErrorResponse'
            - properties:
