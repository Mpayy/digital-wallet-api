services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_wallet_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

    command: postgres -c max_connections=300 -c shared_buffers=256MB